<script>
    // Email button copies the address instead of opening a mail client.
    document.querySelectorAll('.email-copy-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            if (!navigator.clipboard) return;
            e.preventDefault();
            var tip = btn.querySelector('.email-tooltip');
            navigator.clipboard.writeText(btn.dataset.email).then(function () {
                tip.textContent = 'Copied!';
                setTimeout(function () { tip.textContent = 'Click to copy'; }, 1500);
            });
        });
    });

    // Highlight the nav link for the section currently in view.
    var links = document.querySelectorAll('nav a');
    var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            links.forEach(function (a) {
                a.classList.toggle('active', a.getAttribute('href') === '#' + entry.target.id);
            });
        });
    }, { rootMargin: '-40% 0px -55% 0px' });
    document.querySelectorAll('section[id]').forEach(function (s) { observer.observe(s); });
</script>
