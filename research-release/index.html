<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Research releases</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#fbfbfa; --card:#fff; --fg:#17181c; --muted:#5f6570; --line:#e4e4e0; --accent:#d9483b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111317; --card:#181b21; --fg:#eceef2; --muted:#a0a7b4; --line:#2a2f38; --accent:#ff7a6b; } }
:root[data-theme="dark"] { --bg:#111317; --card:#181b21; --fg:#eceef2; --muted:#a0a7b4; --line:#2a2f38; --accent:#ff7a6b; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 Inter, system-ui, sans-serif; }
main { max-width:760px; margin:0 auto; padding:48px 16px; }
h1 { font-size:28px; margin:0 0 4px; }
p.sub { color:var(--muted); margin:0 0 28px; }
a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:14px; color:inherit; text-decoration:none; }
a.card:hover { border-color:var(--accent); }
a.card b { display:block; font-size:18px; }
a.card span { color:var(--muted); font-size:14.5px; }
</style>
</head>
<body>
<main>
  <h1>Research releases</h1>
  <p class="sub">Drafts of release threads for review. Each page has one section per post.</p>
  <a class="card" href="unveil/"><b>UNVEIL: Who Moved the Robot?</b><span>Humanoid datasets remember their operators · NeurIPS 2026 · v2, 2026-11-24</span></a>
</main>
</body>
</html>
